<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#174d43">
<meta name="description" content="Pencatatan data ukur pertanahan di lapangan">
<title>Catatan Ukur</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #edf2ef;
    --card: #ffffff;
    --text: #17231f;
    --muted: #5c6b65;
    --accent: #176b5b;
    --accent-soft: #dcefe8;
    --ok: #20734c;
    --ok-bg: #e0f2e8;
    --err: #c62828;
    --err-bg: #fde0e0;
    --border: #c7d3cd;
    --radius: 8px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg);
    background-image: repeating-linear-gradient(135deg, rgba(23,107,91,.025) 0 1px, transparent 1px 12px);
    color: var(--text);
    font-size: 17px;
    line-height: 1.45;
    padding-bottom: 24px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #174d43;
    color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  #netBadge {
    font-size: 13px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.25);
  }
  #netBadge.off { background: #ffb300; color: #3a2b00; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 0; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(23,35,31,.05);
  }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .section-note { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .station-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .station-grid .station-name { grid-column: 1 / -1; }
  .station-grid label { display: block; margin: 8px 0 5px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .station-grid input { min-height: 48px !important; font-size: 17px !important; }
  .station-save { width: 100%; min-height: 46px; margin-top: 10px; border: 0; border-radius: 8px; background: #174d43; color: #fff; font-size: 15px; font-weight: 700; }
  .station-state { min-height: 18px; margin-top: 7px; color: var(--muted); font-size: 13px; }
  .station-state.ready { color: var(--ok); font-weight: 700; }
  .entry-fields { min-width: 0; margin: 0; padding: 0; border: 0; }
  .entry-fields:disabled { opacity: .48; }
  label.field-label { display: block; font-weight: 600; margin: 12px 0 6px; }
  label.field-label:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: 13px; font-weight: 400; }

  input[type="text"] {
    width: 100%;
    min-height: 56px;
    font-size: 20px;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  input[type="text"].invalid { border-color: var(--err); background: var(--err-bg); }

  .angle-row {
    display: grid;
    grid-template-columns: 82px 82px minmax(90px, 1fr);
    gap: 8px;
    align-items: start;
  }
  .cell { display: flex; flex-direction: column; gap: 4px; }
  .cell .cap { font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; }
  .cell input[type="text"] {
    width: 100%;
    min-height: 64px;
    font-size: 24px;
    text-align: center;
    padding: 8px 4px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .cell input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .cell input[type="text"].invalid { border-color: var(--err); background: var(--err-bg); }
  .angle-cell input[type="text"] { min-height: 44px; padding: 6px 3px; font-size: 18px; }
  .wheel {
    height: 108px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    position: relative;
    border-radius: 8px;
    background: #edf2ef;
    mask-image: linear-gradient(to bottom, transparent, #000 24%, #000 76%, transparent);
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel::after {
    content: "";
    position: absolute;
    top: 36px;
    left: 0;
    right: 0;
    height: 36px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: rgba(23, 107, 91, .06);
    pointer-events: none;
  }
  .wheel-spacer, .wheel-option { height: 36px; }
  .wheel-option {
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    color: var(--muted);
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .wheel-option.selected { color: var(--accent); font-size: 19px; font-weight: 700; }
  .distance-cell { width: 100%; margin: 12px auto 0; }
  @media (max-width: 380px) {
    .angle-row { grid-template-columns: 72px 72px minmax(80px, 1fr); gap: 6px; }
  }

  .err-msg { color: var(--err); font-size: 14px; font-weight: 600; margin-top: 8px; min-height: 20px; }

  .preview {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 18px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 12px;
  }
  .preview .dec { color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    min-height: 44px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    font-size: 16px;
    font-weight: 600;
  }
  .chip:active { background: var(--accent-soft); }

  .save-entry {
    width: 100%;
    min-height: 52px;
    margin-top: 12px;
    border: 0;
    border-radius: 10px;
    background: var(--ok);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    transition: transform .12s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .save-entry:active:not(:disabled) { transform: scale(.975); }
  .save-entry.is-saving { cursor: wait; animation: save-press .32s ease-out; }
  .save-entry.is-saving::before {
    content: "";
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,.45);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .save-entry:disabled { background: #aab3bb; color: #f5f6f7; }
  .form-mode {
    margin: 0 0 12px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #fff2bf;
    color: #674700;
    font-size: 14px;
    font-weight: 700;
  }
  .form-mode button {
    display: block;
    margin-top: 6px;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-decoration: underline;
  }
  #formCard.editing { --accent: #a45a16; --accent-soft: #f8eadb; }
  #formCard.editing .save-entry { background: #a45a16; color: #fff; }
  #formCard.editing .wheel::after { background: rgba(164,90,22,.09); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes save-press {
    0% { transform: scale(1); }
    40% { transform: scale(.975); }
    100% { transform: scale(1); }
  }

  /* ===== Toast ===== */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%) translateY(20px);
    z-index: 30;
    padding: 14px 22px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--ok);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--err); }

  /* ===== Riwayat ===== */
  #historyList { list-style: none; margin: 0; padding: 0; }
  #historyList li {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
  }
  #historyList .info { flex: 1; min-width: 0; }
  #historyList .ket { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #historyList .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #historyList .status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 5px;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  #historyList .status.pending { background: #fff2bf; color: #674700; }
  #historyList .status.sent { background: var(--ok-bg); color: #126532; }
  #historyList .status.local { background: #e8edf2; color: #46515c; }
  #historyList .actions { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
  #historyList button {
    min-height: 40px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
  }
  #historyList button.edit-action { color: var(--accent); border-color: var(--accent); }
  #historyList button.delete-action { color: var(--err); border-color: #e8b8b8; }
  @media (max-width: 420px) {
    #historyList li { grid-template-columns: minmax(0, 1fr); }
    #historyList .actions { justify-content: flex-start; }
  }
  .empty { color: var(--muted); font-size: 15px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
</style>
</head>
<body>

<header>
  <h1>Catatan Ukur</h1>
  <span id="netBadge">—</span>
</header>

<main>
  <section class="card" aria-label="Pengaturan alat">
    <h2>Station Setup</h2>
    <p class="section-note">Tetapkan titik berdiri dan koordinat awal sebelum mulai mengukur.</p>
    <div class="station-grid">
      <div class="station-name">
        <label for="stationName">Nama Titik Berdiri</label>
        <input type="text" id="stationName" placeholder="mis. BM-01" autocomplete="off">
      </div>
      <div>
        <label for="stationX">Koordinat Awal X / Easting</label>
        <input type="text" id="stationX" inputmode="decimal" placeholder="0.000" autocomplete="off">
      </div>
      <div>
        <label for="stationY">Koordinat Awal Y / Northing</label>
        <input type="text" id="stationY" inputmode="decimal" placeholder="0.000" autocomplete="off">
      </div>
    </div>
    <button class="station-save" id="saveStation" type="button">Simpan Pengaturan Alat</button>
    <div class="station-state" id="stationState" role="status"></div>
  </section>

  <!-- ===== Form ===== -->
  <section class="card" id="formCard" aria-label="Formulir ukur">
    <div class="form-mode" id="formMode" hidden>
      <span id="formModeText"></span>
      <button id="cancelEdit" type="button">Batal mengedit</button>
    </div>
    <fieldset class="entry-fields" id="entryFields" disabled>
    <label class="field-label" for="target">Titik Bidik / Target</label>
    <input type="text" id="target" placeholder="mis. Patok-1 atau Batas-A" autocomplete="off" enterkeyhint="next">
    <label class="field-label" for="ket">Keterangan</label>
    <input type="text" id="ket" placeholder="mis. Patok BM-01" autocomplete="off" enterkeyhint="done">
    <div class="chips" id="chips" aria-label="Tombol cepat keterangan"></div>

    <label class="field-label">Sudut <span class="hint">(derajat / menit / detik)</span></label>
    <div class="angle-row">
      <div class="cell angle-cell">
        <input id="d" type="text" inputmode="numeric" autocomplete="off" aria-label="Derajat" placeholder="0">
        <div id="dWheel" class="wheel" role="listbox" tabindex="0" aria-label="Roda derajat"></div>
        <span class="cap">Derajat</span>
      </div>
      <div class="cell angle-cell">
        <input id="m" type="text" inputmode="numeric" autocomplete="off" aria-label="Menit" placeholder="0">
        <div id="mWheel" class="wheel" role="listbox" tabindex="0" aria-label="Roda menit"></div>
        <span class="cap">Menit</span>
      </div>
      <div class="cell">
        <input id="s" type="text" inputmode="decimal" autocomplete="off" aria-label="Detik" placeholder="0.00">
        <span class="cap">Detik</span>
      </div>
    </div>
    <div class="cell distance-cell">
      <input id="jarak" type="text" inputmode="decimal" autocomplete="off" aria-label="Jarak dalam meter" placeholder="0.00">
      <span class="cap">Jarak (m)</span>
    </div>

    <div class="err-msg" id="errMsg" role="alert"></div>

    <div class="preview" id="preview">0° 0' 0" &nbsp;·&nbsp; <span class="dec">0.000000</span></div>
    <button class="save-entry" id="saveButton" type="button" disabled>Simpan Data</button>
    </fieldset>
  </section>

  <!-- ===== Riwayat ===== -->
  <section class="card" aria-label="Riwayat terakhir">
    <h2>5 Input Terakhir</h2>
    <ul id="historyList"></ul>
    <p class="empty" id="historyEmpty">Belum ada data.</p>
  </section>
</main>

<!-- ===== Toast ===== -->
<div id="toast" role="status"></div>

<script>
"use strict";

/* ================= KONFIGURASI ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbxrDeysGfTaQfHTG2oH-42NoBbW_B_vOM0kkV0hvjQphz8Dz-7pT9237FmzvHRdUsAJEg/exec";

/* ================= STATE ================= */
const COLS = ["d", "m", "s", "jarak"];
const CHIP_KEY = "ukur.chips";
const STATION_KEY = "ukur.station";
const CHIP_DEFAULT = ["Patok", "Batas", "Sudut", "Tanah"];
let chipList = loadChips();

const $ = (id) => document.getElementById(id);
const inputs = { d: $("d"), m: $("m"), s: $("s"), jarak: $("jarak") };
const wheels = { d: $("dWheel"), m: $("mWheel") };
const WHEEL_ROW_HEIGHT = 36;
const wheelTimers = {};
let currentEditId = null;
let currentEntryStation = null;
let activeStation = null;
let stationReady = false;
let saving = false;
let processingQueue = false;

/* ================= CHIP CEPAT ================= */
function loadChips() {
  try {
    const raw = localStorage.getItem(CHIP_KEY);
    if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr) && arr.length) return arr; }
  } catch (e) { /* abaikan */ }
  return [...CHIP_DEFAULT];
}
function saveChips() {
  try { localStorage.setItem(CHIP_KEY, JSON.stringify(chipList)); } catch (e) { /* abaikan */ }
}
function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  chipList.forEach((c) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = c;
    b.addEventListener("click", () => { $("ket").value = c; });
    box.appendChild(b);
  });
  // Chip "+" untuk menambah daftar cepat
  const add = document.createElement("button");
  add.className = "chip";
  add.type = "button";
  add.textContent = "+ Tambah";
  add.addEventListener("click", () => {
    const v = prompt("Teks chip baru:", "");
    if (v && v.trim()) {
      chipList.push(v.trim().slice(0, 30));
      saveChips(); renderChips();
    }
  });
  box.appendChild(add);
}

/* ================= INPUT ANGKA & RODA GULIR ================= */
function updateWheelSelection(col, selectedIndex) {
  [...wheels[col].querySelectorAll(".wheel-option")].forEach((option, index) => {
    const selected = index === selectedIndex;
    option.classList.toggle("selected", selected);
    option.setAttribute("aria-selected", String(selected));
  });
}

function setWheelPosition(col, value) {
  const max = col === "d" ? 360 : 59;
  const numericValue = Number(value);
  const index = Number.isFinite(numericValue) ? Math.max(0, Math.min(max, Math.round(numericValue))) : 0;
  wheels[col].scrollTop = index * WHEEL_ROW_HEIGHT;
  updateWheelSelection(col, index);
}

function selectWheelValue(col) {
  const max = col === "d" ? 360 : 59;
  const index = Math.max(0, Math.min(max, Math.round(wheels[col].scrollTop / WHEEL_ROW_HEIGHT)));
  inputs[col].value = String(index);
  updateWheelSelection(col, index);
  validate();
}

function renderWheels() {
  Object.keys(wheels).forEach((col) => {
    const wheel = wheels[col];
    const max = col === "d" ? 360 : 59;
    const topSpace = document.createElement("div");
    topSpace.className = "wheel-spacer";
    topSpace.setAttribute("aria-hidden", "true");
    wheel.appendChild(topSpace);
    for (let value = 0; value <= max; value += 1) {
      const option = document.createElement("div");
      option.className = "wheel-option";
      option.setAttribute("role", "option");
      option.textContent = String(value);
      wheel.appendChild(option);
    }
    const bottomSpace = topSpace.cloneNode();
    wheel.appendChild(bottomSpace);
    wheel.addEventListener("scroll", () => {
      clearTimeout(wheelTimers[col]);
      wheelTimers[col] = setTimeout(() => selectWheelValue(col), 120);
    }, { passive: true });
    setWheelPosition(col, 0);
  });
}

COLS.forEach((col) => inputs[col].addEventListener("input", () => {
  if (wheels[col]) {
    const value = parseNum(inputs[col].value);
    setWheelPosition(col, Number.isNaN(value) ? 0 : value);
  }
  validate();
}));

/* ================= VALIDASI & PRATINJAU ================= */
function parseNum(v) { return v === "" ? NaN : Number(v); }

function validate() {
  const d = inputs.d.value, m = inputs.m.value, s = inputs.s.value, j = inputs.jarak.value;
  let msg = "";

  const dN = parseNum(d), mN = parseNum(m), sN = parseNum(s), jN = parseNum(j);

  if (d !== "" && (isNaN(dN) || dN < 0 || dN > 360)) msg = "Derajat harus 0–360.";
  else if (m !== "" && (isNaN(mN) || mN < 0 || mN > 59)) msg = "Menit harus 0–59.";
  else if (s !== "" && (isNaN(sN) || sN < 0 || sN > 59.99)) msg = "Detik harus 0–59,99.";
  else if (d !== "" && m !== "" && s !== "" && dN === 360 && (mN !== 0 || sN !== 0)) msg = "Untuk 360°, menit dan detik harus 0.";
  else if (j !== "" && (isNaN(jN) || jN < 0)) msg = "Jarak harus ≥ 0.";
  else if ((d || m || s || j) && !$("target").value.trim()) msg = "Nama titik bidik harus diisi.";

  // Tandai kolom tidak valid
  inputs.d.classList.toggle("invalid", d !== "" && (isNaN(dN) || dN < 0 || dN > 360));
  inputs.m.classList.toggle("invalid", m !== "" && (isNaN(mN) || mN < 0 || mN > 59));
  inputs.s.classList.toggle("invalid", s !== "" && (isNaN(sN) || sN < 0 || sN > 59.99));
  inputs.jarak.classList.toggle("invalid", j !== "" && (isNaN(jN) || jN < 0));
  $("target").classList.toggle("invalid", !!(d || m || s || j) && !$("target").value.trim());

  $("errMsg").textContent = msg;
  updatePreview();
  updateSaveButton();
  return msg === "";
}

function updateSaveButton() {
  const button = $("saveButton");
  button.textContent = saving ? "Menyimpan..." : currentEditId ? "Simpan Perubahan" : "Simpan Data";
  button.classList.toggle("is-saving", saving);
  button.disabled = saving || !stationReady || !formValid();
}

function formValid() {
  const dN = parseNum(inputs.d.value), mN = parseNum(inputs.m.value),
        sN = parseNum(inputs.s.value), jN = parseNum(inputs.jarak.value);
  return inputs.d.value !== "" && !isNaN(dN) && dN >= 0 && dN <= 360 &&
         inputs.m.value !== "" && !isNaN(mN) && mN >= 0 && mN <= 59 &&
         inputs.s.value !== "" && !isNaN(sN) && sN >= 0 && sN <= 59.99 &&
      !(dN === 360 && (mN !== 0 || sN !== 0)) &&
      inputs.jarak.value !== "" && !isNaN(jN) && jN >= 0 &&
      $("target").value.trim() !== "";
}

function updatePreview() {
  const dN = parseNum(inputs.d.value), mN = parseNum(inputs.m.value), sN = parseNum(inputs.s.value);
  if (isNaN(dN) || isNaN(mN) || isNaN(sN)) {
    $("preview").innerHTML = "Azimut &nbsp;·&nbsp; <span class=\"dec\">0.000000°</span><br><span class=\"hint\">X akhir — &nbsp; Y akhir —</span>";
    return;
  }
  const dec = dN + mN / 60 + sN / 3600;
  const station = currentEditId && currentEntryStation ? currentEntryStation : activeStation;
  const distance = parseNum(inputs.jarak.value);
  const radians = dec * Math.PI / 180;
  const xEnd = station && !isNaN(distance) ? Number(station.x) + distance * Math.sin(radians) : NaN;
  const yEnd = station && !isNaN(distance) ? Number(station.y) + distance * Math.cos(radians) : NaN;
  $("preview").innerHTML =
    "Azimut &nbsp;·&nbsp; <span class=\"dec\">" + dec.toFixed(6) + "°</span><br>" +
    "<span class=\"hint\">X akhir " + (isNaN(xEnd) ? "—" : xEnd.toFixed(3)) +
    " &nbsp;·&nbsp; Y akhir " + (isNaN(yEnd) ? "—" : yEnd.toFixed(3)) + "</span>";
}

/* ================= ANTREAN & PENGIRIMAN ================= */
const QUEUE_KEY = "ukur.antrean";
const HIST_KEY = "ukur.riwayat";

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) { const v = JSON.parse(raw); if (v !== null) return v; }
  } catch (e) { /* abaikan */ }
  return fallback;
}
function saveQueue(q) { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) { /* abaikan */ } }
function saveHistory(history) {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(history.slice(0, 5))); } catch (e) { /* abaikan */ }
}

function getQueue() { return loadJSON(QUEUE_KEY, []); }

function isValidStation(station) {
  return !!station && typeof station.name === "string" && station.name.trim() !== "" &&
    Number.isFinite(Number(station.x)) && Number.isFinite(Number(station.y));
}

function initStationSetup() {
  activeStation = loadJSON(STATION_KEY, null);
  if (isValidStation(activeStation)) {
    $("stationName").value = activeStation.name;
    $("stationX").value = String(activeStation.x);
    $("stationY").value = String(activeStation.y);
    stationReady = true;
    $("stationState").textContent = "Aktif: " + activeStation.name;
    $("stationState").classList.add("ready");
  }
  $("entryFields").disabled = !stationReady;
}

function saveStationSetup() {
  const station = {
    name: $("stationName").value.trim(),
    x: parseNum($("stationX").value),
    y: parseNum($("stationY").value),
  };
  const invalid = !isValidStation(station);
  $("stationName").classList.toggle("invalid", !station.name);
  $("stationX").classList.toggle("invalid", !Number.isFinite(station.x));
  $("stationY").classList.toggle("invalid", !Number.isFinite(station.y));
  if (invalid) {
    $("stationState").textContent = "Isi nama titik dan koordinat X/Y dengan angka yang valid.";
    $("stationState").classList.remove("ready");
    return;
  }
  activeStation = station;
  stationReady = true;
  try { localStorage.setItem(STATION_KEY, JSON.stringify(station)); } catch (e) { /* abaikan */ }
  $("entryFields").disabled = false;
  $("stationState").textContent = "Aktif: " + station.name;
  $("stationState").classList.add("ready");
  $("stationName").classList.remove("invalid");
  $("stationX").classList.remove("invalid");
  $("stationY").classList.remove("invalid");
  validate();
  toast("Pengaturan alat tersimpan");
}

function measurementValues() {
  const station = currentEditId && currentEntryStation ? currentEntryStation : activeStation;
  const d = parseNum(inputs.d.value), m = parseNum(inputs.m.value);
  const s = parseNum(inputs.s.value), distance = parseNum(inputs.jarak.value);
  const azimuth = d + m / 60 + s / 3600;
  const radians = azimuth * Math.PI / 180;
  return {
    titikBerdiri: station.name,
    titikBidik: $("target").value.trim(),
    keterangan: $("ket").value.trim(),
    xAwal: Number(station.x),
    yAwal: Number(station.y),
    derajat: d,
    menit: m,
    detik: s,
    azimutDesimal: +azimuth.toFixed(6),
    jarak: distance,
    xAkhir: Number(station.x) + distance * Math.sin(radians),
    yAkhir: Number(station.y) + distance * Math.cos(radians),
  };
}

function updateNetBadge() {
  const badge = $("netBadge");
  const q = getQueue();
  if (!navigator.onLine) {
    badge.textContent = q.length ? "Offline · " + q.length + " menunggu" : "Offline";
    badge.classList.add("off");
  } else if (q.length) {
    badge.textContent = q.length + " menunggu terkirim";
    badge.classList.add("off");
  } else {
    badge.textContent = "Daring";
    badge.classList.remove("off");
  }
}

async function kirim(entry) {
  const payload = entry.action === "delete"
    ? { action: "delete", id: entry.id }
    : {
        ...entry,
        action: "upsert",
        ...(entry.titikBerdiri ? {} : {
          titikBerdiri: activeStation && activeStation.name,
          titikBidik: entry.titikBidik || entry.keterangan || "(target lama)",
          xAwal: activeStation && Number(activeStation.x),
          yAwal: activeStation && Number(activeStation.y),
        }),
      };
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  });
  let data;
  try { data = await res.json(); } catch (e) { throw new Error("Respons bukan JSON"); }
  if (!res.ok || !data || data.ok !== true) {
    throw new Error((data && data.error) || ("HTTP " + res.status));
  }
}

async function processQueue() {
  if (!navigator.onLine || processingQueue) return;
  const queue = getQueue();
  if (!queue.length) return;
  processingQueue = true;
  const terkirim = new Set();
  const upsertTerkirim = new Set();
  try {
    for (const entry of queue) {
      try {
        await kirim(entry);
        terkirim.add(entry.id);
        if (entry.action !== "delete") upsertTerkirim.add(entry.id);
      } catch (e) {
        // Tetap di antrean untuk percobaan berikutnya.
      }
    }
    saveQueue(getQueue().filter((entry) => !terkirim.has(entry.id)));
    if (upsertTerkirim.size) {
      const history = loadJSON(HIST_KEY, []);
      history.forEach((entry) => {
        if (upsertTerkirim.has(entry.id)) entry.serverSynced = true;
      });
      saveHistory(history);
    }
    updateNetBadge();
    renderHistory();
    return { sent: terkirim.size, pending: getQueue().length };
  } finally {
    processingQueue = false;
  }
}

async function saveEntry() {
  if (saving) return;
  if (!formValid()) { validate(); return; }
  saving = true;
  updateSaveButton();
  const dN = parseNum(inputs.d.value), mN = parseNum(inputs.m.value),
        sN = parseNum(inputs.s.value), jN = parseNum(inputs.jarak.value);
  const values = measurementValues();
  try {
    const history = loadJSON(HIST_KEY, []);
    if (currentEditId) {
      const index = history.findIndex((entry) => entry.id === currentEditId);
      if (index === -1) {
        toast("Data tidak ditemukan", true);
        cancelEditing();
        return;
      }
      const queue = getQueue();
      const queueIndex = queue.findIndex((entry) => entry.id === currentEditId);
      const updated = {
        ...history[index],
        ...values,
        waktu: new Date().toISOString(),
        serverSynced: history[index].serverSynced === true || queueIndex < 0,
      };
      if (queueIndex >= 0) queue[queueIndex] = updated;
      else queue.push(updated);
      saveQueue(queue);
      history[index] = updated;
      saveHistory(history);
      cancelEditing();
      resetForm();
      renderHistory();
      if (navigator.onLine) await processQueue();
      const stillPending = getQueue().some((entry) => entry.id === updated.id);
      toast(stillPending ? "Edit disimpan, menunggu terkirim" : "Edit terkirim ke spreadsheet");
    } else {
      const entry = { id: crypto.randomUUID(), waktu: new Date().toISOString(), ...values };
      history.unshift(entry);
      saveHistory(history);
      const queue = getQueue();
      queue.push(entry);
      saveQueue(queue);
      resetForm();
      renderHistory();
      if (navigator.onLine) await processQueue();
      const stillPending = getQueue().some((queued) => queued.id === entry.id);
      toast(stillPending ? "Data Pending, akan dikirim saat tersambung" : "Data terkirim");
    }
  } finally {
    saving = false;
    validate();
  }
  navigator.vibrate && navigator.vibrate(50);
  updateNetBadge();
}

function resetForm() {
  $("target").value = "";
  $("ket").value = "";
  COLS.forEach((col) => { inputs[col].value = ""; inputs[col].classList.remove("invalid"); });
  Object.keys(wheels).forEach((col) => setWheelPosition(col, 0));
  $("errMsg").textContent = "";
  updatePreview();
}

function cancelEditing() {
  currentEditId = null;
  currentEntryStation = null;
  $("formCard").classList.remove("editing");
  $("formMode").hidden = true;
  updateSaveButton();
}

function editEntry(entry) {
  currentEditId = entry.id;
  currentEntryStation = isValidStation({ name: entry.titikBerdiri, x: entry.xAwal, y: entry.yAwal })
    ? { name: entry.titikBerdiri, x: entry.xAwal, y: entry.yAwal }
    : activeStation;
  $("formCard").classList.add("editing");
  $("formMode").hidden = false;
  $("formModeText").textContent = "Edit target: " + (entry.titikBidik || "(target lama)") +
    " · berdiri di " + (currentEntryStation ? currentEntryStation.name : "(setup aktif)");
  $("target").value = entry.titikBidik || "";
  $("ket").value = entry.keterangan || "";
  inputs.d.value = String(entry.derajat);
  inputs.m.value = String(entry.menit);
  inputs.s.value = String(entry.detik);
  inputs.jarak.value = String(entry.jarak);
  setWheelPosition("d", entry.derajat);
  setWheelPosition("m", entry.menit);
  validate();
  $("formCard").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function deleteEntry(entry) {
  const queue = getQueue();
  if (!confirm("Hapus data ini dari riwayat perangkat dan spreadsheet?")) return;
  saveHistory(loadJSON(HIST_KEY, []).filter((item) => item.id !== entry.id));
  const remainingQueue = queue.filter((item) => item.id !== entry.id);
  remainingQueue.push({ id: entry.id, action: "delete" });
  saveQueue(remainingQueue);
  if (currentEditId === entry.id) {
    cancelEditing();
    resetForm();
  }
  renderHistory();
  updateNetBadge();
  if (navigator.onLine) await processQueue();
  const deletePending = getQueue().some((item) => item.id === entry.id && item.action === "delete");
  toast(deletePending ? "Hapus menunggu koneksi" : "Data dihapus");
}

/* ================= RIWAYAT ================= */
function renderHistory() {
  const hist = loadJSON(HIST_KEY, []);
  const ul = $("historyList");
  ul.innerHTML = "";
  $("historyEmpty").style.display = hist.length ? "none" : "block";
  hist.forEach((h) => {
    const li = document.createElement("li");
    const info = document.createElement("div");
    info.className = "info";
    const az = h.azimutDesimal ?? (h.derajat + h.menit / 60 + h.detik / 3600);
    info.innerHTML =
      "<div class=\"ket\"></div>" +
      "<div class=\"sub\">" + (h.titikBidik || "(target lama)") + " · " + az.toFixed(3) + "° · " + h.jarak + " m · " +
      new Date(h.waktu).toLocaleString("id-ID") + "</div>";
    info.querySelector(".ket").textContent = (h.titikBerdiri || "") + " → " + (h.titikBidik || "(target lama)") +
      (h.keterangan ? " · " + h.keterangan : "");
    const pending = getQueue().some((entry) => entry.id === h.id);
    const status = document.createElement("span");
    status.className = "status " + (pending ? "pending" : "sent");
    status.textContent = pending ? "Pending" : "Terkirim";
    info.appendChild(status);
    const actions = document.createElement("div");
    actions.className = "actions";
    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.className = "edit-action";
    editButton.textContent = "Edit";
    editButton.addEventListener("click", () => editEntry(h));
    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-action";
    deleteButton.textContent = "Hapus";
    deleteButton.addEventListener("click", () => deleteEntry(h));
    actions.append(editButton, deleteButton);
    li.appendChild(info);
    li.appendChild(actions);
    ul.appendChild(li);
  });
}

/* ================= TOAST ================= */
let toastTimer = null;
function toast(text, isError) {
  const t = $("toast");
  t.textContent = text;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ================= EVENT ================= */
window.addEventListener("online", () => { updateNetBadge(); processQueue(); });
window.addEventListener("offline", updateNetBadge);
window.addEventListener("load", () => { updateNetBadge(); processQueue(); });

/* ================= SERVICE WORKER & WAKE LOCK ================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* abaikan */ });
  });
}

let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) { /* opsional — lanjut tanpa galat */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});
requestWakeLock();

/* ================= INIT ================= */
renderChips();
renderWheels();
initStationSetup();
renderHistory();
validate();
updateNetBadge();
$("saveButton").addEventListener("click", saveEntry);
$("saveStation").addEventListener("click", saveStationSetup);
$("target").addEventListener("input", validate);
inputs.jarak.addEventListener("input", updatePreview);
$("cancelEdit").addEventListener("click", () => { cancelEditing(); resetForm(); validate(); });
</script>
