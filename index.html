<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b5fff">
<meta name="description" content="Pencatatan data ukur pertanahan di lapangan">
<title>Catatan Ukur</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #101418;
    --muted: #5b6570;
    --accent: #0b5fff;
    --accent-soft: #dbe7ff;
    --ok: #0f8a3d;
    --ok-bg: #dcf5e5;
    --err: #c62828;
    --err-bg: #fde0e0;
    --border: #c9d1d9;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.45;
    padding-bottom: 24px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--accent);
    color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  #netBadge {
    font-size: 13px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.25);
  }
  #netBadge.off { background: #ffb300; color: #3a2b00; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 0; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(16,24,40,.08);
  }
  label.field-label { display: block; font-weight: 600; margin: 12px 0 6px; }
  label.field-label:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: 13px; font-weight: 400; }

  input[type="text"] {
    width: 100%;
    min-height: 56px;
    font-size: 20px;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  .angle-row {
    display: grid;
    grid-template-columns: 82px 82px minmax(90px, 1fr);
    gap: 8px;
    align-items: start;
  }
  .cell { display: flex; flex-direction: column; gap: 4px; }
  .cell .cap { font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; }
  .cell input[type="text"] {
    width: 100%;
    min-height: 64px;
    font-size: 24px;
    text-align: center;
    padding: 8px 4px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .cell input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .cell input[type="text"].invalid { border-color: var(--err); background: var(--err-bg); }
  .angle-cell input[type="text"] { min-height: 44px; padding: 6px 3px; font-size: 18px; }
  .wheel {
    height: 108px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    position: relative;
    border-radius: 8px;
    background: #f4f6f8;
    mask-image: linear-gradient(to bottom, transparent, #000 24%, #000 76%, transparent);
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel::after {
    content: "";
    position: absolute;
    top: 36px;
    left: 0;
    right: 0;
    height: 36px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: rgba(11, 95, 255, .06);
    pointer-events: none;
  }
  .wheel-spacer, .wheel-option { height: 36px; }
  .wheel-option {
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: start;
    color: var(--muted);
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .wheel-option.selected { color: var(--accent); font-size: 19px; font-weight: 700; }
  .distance-cell { width: 100%; margin: 12px auto 0; }
  @media (max-width: 380px) {
    .angle-row { grid-template-columns: 72px 72px minmax(80px, 1fr); gap: 6px; }
  }

  .err-msg { color: var(--err); font-size: 14px; font-weight: 600; margin-top: 8px; min-height: 20px; }

  .preview {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 18px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 12px;
  }
  .preview .dec { color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    min-height: 44px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 2px solid var(--accent);
    background: #fff;
    color: var(--accent);
    font-size: 16px;
    font-weight: 600;
  }
  .chip:active { background: var(--accent-soft); }

  .save-entry {
    width: 100%;
    min-height: 52px;
    margin-top: 12px;
    border: 0;
    border-radius: 10px;
    background: var(--ok);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    transition: transform .12s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .save-entry:active:not(:disabled) { transform: scale(.975); }
  .save-entry.is-saving { cursor: wait; animation: save-press .32s ease-out; }
  .save-entry.is-saving::before {
    content: "";
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,.45);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .save-entry:disabled { background: #aab3bb; color: #f5f6f7; }
  .form-mode {
    margin: 0 0 12px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #fff2bf;
    color: #674700;
    font-size: 14px;
    font-weight: 700;
  }
  .form-mode button {
    display: block;
    margin-top: 6px;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-decoration: underline;
  }
  #formCard.editing { --accent: #a96b00; --accent-soft: #fff2bf; }
  #formCard.editing .save-entry { background: #b77900; color: #fff; }
  #formCard.editing .wheel::after { background: rgba(183,121,0,.09); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes save-press {
    0% { transform: scale(1); }
    40% { transform: scale(.975); }
    100% { transform: scale(1); }
  }

  /* ===== Toast ===== */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%) translateY(20px);
    z-index: 30;
    padding: 14px 22px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--ok);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--err); }

  /* ===== Riwayat ===== */
  #historyList { list-style: none; margin: 0; padding: 0; }
  #historyList li {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
  }
  #historyList .info { flex: 1; min-width: 0; }
  #historyList .ket { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #historyList .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #historyList .status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 5px;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  #historyList .status.pending { background: #fff2bf; color: #674700; }
  #historyList .status.sent { background: var(--ok-bg); color: #126532; }
  #historyList .status.local { background: #e8edf2; color: #46515c; }
  #historyList .actions { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
  #historyList button {
    min-height: 40px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
  }
  #historyList button.edit-action { color: var(--accent); border-color: var(--accent); }
  #historyList button.delete-action { color: var(--err); border-color: #e8b8b8; }
  @media (max-width: 420px) {
    #historyList li { grid-template-columns: minmax(0, 1fr); }
    #historyList .actions { justify-content: flex-start; }
  }
  .empty { color: var(--muted); font-size: 15px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
</style>
</head>
<body>

<header>
  <h1>Catatan Ukur</h1>
  <span id="netBadge">—</span>
</header>

<main>
  <!-- ===== Form ===== -->
  <section class="card" id="formCard" aria-label="Formulir ukur">
    <div class="form-mode" id="formMode" hidden>
      <span id="formModeText"></span>
      <button id="cancelEdit" type="button">Batal mengedit</button>
    </div>
    <label class="field-label" for="ket">Keterangan</label>
    <input type="text" id="ket" placeholder="mis. Patok BM-01" autocomplete="off" enterkeyhint="done">
    <div class="chips" id="chips" aria-label="Tombol cepat keterangan"></div>

    <label class="field-label">Sudut <span class="hint">(derajat / menit / detik)</span></label>
    <div class="angle-row">
      <div class="cell angle-cell">
        <input id="d" type="text" inputmode="numeric" autocomplete="off" aria-label="Derajat" placeholder="0">
        <div id="dWheel" class="wheel" role="listbox" tabindex="0" aria-label="Roda derajat"></div>
        <span class="cap">Derajat</span>
      </div>
      <div class="cell angle-cell">
        <input id="m" type="text" inputmode="numeric" autocomplete="off" aria-label="Menit" placeholder="0">
        <div id="mWheel" class="wheel" role="listbox" tabindex="0" aria-label="Roda menit"></div>
        <span class="cap">Menit</span>
      </div>
      <div class="cell">
        <input id="s" type="text" inputmode="decimal" autocomplete="off" aria-label="Detik" placeholder="0.00">
        <span class="cap">Detik</span>
      </div>
    </div>
    <div class="cell distance-cell">
      <input id="jarak" type="text" inputmode="decimal" autocomplete="off" aria-label="Jarak dalam meter" placeholder="0.00">
      <span class="cap">Jarak (m)</span>
    </div>

    <div class="err-msg" id="errMsg" role="alert"></div>

    <div class="preview" id="preview">0° 0' 0" &nbsp;·&nbsp; <span class="dec">0.000000</span></div>
    <button class="save-entry" id="saveButton" type="button" disabled>Simpan Data</button>
  </section>

  <!-- ===== Riwayat ===== -->
  <section class="card" aria-label="Riwayat terakhir">
    <h2>5 Input Terakhir</h2>
    <ul id="historyList"></ul>
    <p class="empty" id="historyEmpty">Belum ada data.</p>
  </section>
</main>

<!-- ===== Toast ===== -->
<div id="toast" role="status"></div>

<script>
"use strict";

/* ================= KONFIGURASI ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbywu7pHXzfFJz8xwvbiAm5UQiy3sEAKnLPUQ7dcHtCfO5bJ2aOuTb_nq15jpmegqtg2zQ/exec";

/* ================= STATE ================= */
const COLS = ["d", "m", "s", "jarak"];
const CHIP_KEY = "ukur.chips";
const CHIP_DEFAULT = ["Patok", "Batas", "Sudut", "Tanah"];
let chipList = loadChips();

const $ = (id) => document.getElementById(id);
const inputs = { d: $("d"), m: $("m"), s: $("s"), jarak: $("jarak") };
const wheels = { d: $("dWheel"), m: $("mWheel") };
const WHEEL_ROW_HEIGHT = 36;
const wheelTimers = {};
let currentEditId = null;
let saving = false;
let processingQueue = false;

/* ================= CHIP CEPAT ================= */
function loadChips() {
  try {
    const raw = localStorage.getItem(CHIP_KEY);
    if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr) && arr.length) return arr; }
  } catch (e) { /* abaikan */ }
  return [...CHIP_DEFAULT];
}
function saveChips() {
  try { localStorage.setItem(CHIP_KEY, JSON.stringify(chipList)); } catch (e) { /* abaikan */ }
}
function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  chipList.forEach((c) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = c;
    b.addEventListener("click", () => { $("ket").value = c; });
    box.appendChild(b);
  });
  // Chip "+" untuk menambah daftar cepat
  const add = document.createElement("button");
  add.className = "chip";
  add.type = "button";
  add.textContent = "+ Tambah";
  add.addEventListener("click", () => {
    const v = prompt("Teks chip baru:", "");
    if (v && v.trim()) {
      chipList.push(v.trim().slice(0, 30));
      saveChips(); renderChips();
    }
  });
  box.appendChild(add);
}

/* ================= INPUT ANGKA & RODA GULIR ================= */
function updateWheelSelection(col, selectedIndex) {
  [...wheels[col].querySelectorAll(".wheel-option")].forEach((option, index) => {
    const selected = index === selectedIndex;
    option.classList.toggle("selected", selected);
    option.setAttribute("aria-selected", String(selected));
  });
}

function setWheelPosition(col, value) {
  const max = col === "d" ? 360 : 59;
  const index = Math.max(0, Math.min(max, Math.round(value)));
  wheels[col].scrollTop = index * WHEEL_ROW_HEIGHT;
  updateWheelSelection(col, index);
}

function selectWheelValue(col) {
  const max = col === "d" ? 360 : 59;
  const index = Math.max(0, Math.min(max, Math.round(wheels[col].scrollTop / WHEEL_ROW_HEIGHT)));
  inputs[col].value = String(index);
  updateWheelSelection(col, index);
  validate();
}

function renderWheels() {
  Object.keys(wheels).forEach((col) => {
    const wheel = wheels[col];
    const max = col === "d" ? 360 : 59;
    const topSpace = document.createElement("div");
    topSpace.className = "wheel-spacer";
    topSpace.setAttribute("aria-hidden", "true");
    wheel.appendChild(topSpace);
    for (let value = 0; value <= max; value += 1) {
      const option = document.createElement("div");
      option.className = "wheel-option";
      option.setAttribute("role", "option");
      option.textContent = String(value);
      wheel.appendChild(option);
    }
    const bottomSpace = topSpace.cloneNode();
    wheel.appendChild(bottomSpace);
    wheel.addEventListener("scroll", () => {
      clearTimeout(wheelTimers[col]);
      wheelTimers[col] = setTimeout(() => selectWheelValue(col), 120);
    }, { passive: true });
    setWheelPosition(col, 0);
  });
}

COLS.forEach((col) => inputs[col].addEventListener("input", () => {
  if (wheels[col]) {
    const value = parseNum(inputs[col].value);
    setWheelPosition(col, Number.isNaN(value) ? 0 : value);
  }
  validate();
}));

/* ================= VALIDASI & PRATINJAU ================= */
function parseNum(v) { return v === "" ? NaN : Number(v); }

function validate() {
  const d = inputs.d.value, m = inputs.m.value, s = inputs.s.value, j = inputs.jarak.value;
  let msg = "";

  const dN = parseNum(d), mN = parseNum(m), sN = parseNum(s), jN = parseNum(j);

  if (d !== "" && (isNaN(dN) || dN < 0 || dN > 360)) msg = "Derajat harus 0–360.";
  else if (m !== "" && (isNaN(mN) || mN < 0 || mN > 59)) msg = "Menit harus 0–59.";
  else if (s !== "" && (isNaN(sN) || sN < 0 || sN > 59.99)) msg = "Detik harus 0–59,99.";
  else if (j !== "" && (isNaN(jN) || jN < 0)) msg = "Jarak harus ≥ 0.";

  // Tandai kolom tidak valid
  inputs.d.classList.toggle("invalid", d !== "" && (isNaN(dN) || dN < 0 || dN > 360));
  inputs.m.classList.toggle("invalid", m !== "" && (isNaN(mN) || mN < 0 || mN > 59));
  inputs.s.classList.toggle("invalid", s !== "" && (isNaN(sN) || sN < 0 || sN > 59.99));
  inputs.jarak.classList.toggle("invalid", j !== "" && (isNaN(jN) || jN < 0));

  $("errMsg").textContent = msg;
  updatePreview();
  updateSaveButton();
  return msg === "";
}

function updateSaveButton() {
  const button = $("saveButton");
  button.textContent = saving ? "Menyimpan..." : currentEditId ? "Simpan Perubahan" : "Simpan Data";
  button.classList.toggle("is-saving", saving);
  button.disabled = saving || !formValid();
}

function formValid() {
  const dN = parseNum(inputs.d.value), mN = parseNum(inputs.m.value),
        sN = parseNum(inputs.s.value), jN = parseNum(inputs.jarak.value);
  return inputs.d.value !== "" && !isNaN(dN) && dN >= 0 && dN <= 360 &&
         inputs.m.value !== "" && !isNaN(mN) && mN >= 0 && mN <= 59 &&
         inputs.s.value !== "" && !isNaN(sN) && sN >= 0 && sN <= 59.99 &&
         inputs.jarak.value !== "" && !isNaN(jN) && jN >= 0;
}

function updatePreview() {
  const dN = parseNum(inputs.d.value), mN = parseNum(inputs.m.value), sN = parseNum(inputs.s.value);
  if (isNaN(dN) || isNaN(mN) || isNaN(sN)) {
    $("preview").innerHTML = "0° 0' 0\" &nbsp;·&nbsp; <span class=\"dec\">0.000000</span>";
    return;
  }
  const dec = dN + mN / 60 + sN / 3600;
  const sStr = sN % 1 === 0 ? String(sN) : sN.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
  $("preview").innerHTML =
    dN + "° " + mN + "' " + sStr + "\" &nbsp;·&nbsp; <span class=\"dec\">" + dec.toFixed(6) + "</span>";
}

/* ================= ANTREAN & PENGIRIMAN ================= */
const QUEUE_KEY = "ukur.antrean";
const HIST_KEY = "ukur.riwayat";

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) { const v = JSON.parse(raw); if (v !== null) return v; }
  } catch (e) { /* abaikan */ }
  return fallback;
}
function saveQueue(q) { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) { /* abaikan */ } }
function saveHistory(history) {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(history.slice(0, 5))); } catch (e) { /* abaikan */ }
}

function getQueue() { return loadJSON(QUEUE_KEY, []); }

function updateNetBadge() {
  const badge = $("netBadge");
  const q = getQueue();
  if (!navigator.onLine) {
    badge.textContent = q.length ? "Offline · " + q.length + " menunggu" : "Offline";
    badge.classList.add("off");
  } else if (q.length) {
    badge.textContent = q.length + " menunggu terkirim";
    badge.classList.add("off");
  } else {
    badge.textContent = "Daring";
    badge.classList.remove("off");
  }
}

async function kirim(entry) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(entry),
  });
  let data;
  try { data = await res.json(); } catch (e) { throw new Error("Respons bukan JSON"); }
  if (!res.ok || !data || data.ok !== true) {
    throw new Error((data && data.error) || ("HTTP " + res.status));
  }
}

async function processQueue() {
  if (!navigator.onLine || processingQueue) return;
  const queue = getQueue();
  if (!queue.length) return;
  processingQueue = true;
  const terkirim = new Set();
  try {
    for (const entry of queue) {
      try {
        await kirim(entry);
        terkirim.add(entry.id);
      } catch (e) {
        // Tetap di antrean untuk percobaan berikutnya.
      }
    }
    saveQueue(getQueue().filter((entry) => !terkirim.has(entry.id)));
    updateNetBadge();
    renderHistory();
    return { sent: terkirim.size, pending: getQueue().length };
  } finally {
    processingQueue = false;
  }
}

async function saveEntry() {
  if (saving) return;
  if (!formValid()) { validate(); return; }
  saving = true;
  updateSaveButton();
  const dN = parseNum(inputs.d.value), mN = parseNum(inputs.m.value),
        sN = parseNum(inputs.s.value), jN = parseNum(inputs.jarak.value);
  const values = {
    keterangan: $("ket").value.trim(),
    derajat: dN,
    menit: mN,
    detik: sN,
    desimal: +(dN + mN / 60 + sN / 3600).toFixed(6),
    jarak: jN,
  };
  try {
    const history = loadJSON(HIST_KEY, []);
    if (currentEditId) {
      const index = history.findIndex((entry) => entry.id === currentEditId);
      if (index === -1) {
        toast("Data tidak ditemukan", true);
        cancelEditing();
        return;
      }
      const queue = getQueue();
      const queueIndex = queue.findIndex((entry) => entry.id === currentEditId);
      const updated = { ...history[index], ...values, waktu: new Date().toISOString() };
      if (queueIndex >= 0) {
        queue[queueIndex] = updated;
        saveQueue(queue);
      } else {
        updated.localEdit = true;
      }
      history[index] = updated;
      saveHistory(history);
      const editedLabel = updated.keterangan || "(tanpa keterangan)";
      cancelEditing();
      resetForm();
      renderHistory();
      if (queueIndex >= 0) {
        if (navigator.onLine) await processQueue();
        const stillPending = getQueue().some((entry) => entry.id === updated.id);
        toast(stillPending ? "Edit disimpan, status Pending" : "Edit terkirim");
      } else {
        toast("Edit " + editedLabel + " tersimpan di perangkat; data spreadsheet belum berubah");
      }
    } else {
      const entry = { id: crypto.randomUUID(), waktu: new Date().toISOString(), ...values };
      history.unshift(entry);
      saveHistory(history);
      const queue = getQueue();
      queue.push(entry);
      saveQueue(queue);
      resetForm();
      renderHistory();
      if (navigator.onLine) await processQueue();
      const stillPending = getQueue().some((queued) => queued.id === entry.id);
      toast(stillPending ? "Data Pending, akan dikirim saat tersambung" : "Data terkirim");
    }
  } finally {
    saving = false;
    validate();
  }
  navigator.vibrate && navigator.vibrate(50);
  updateNetBadge();
}

function resetForm() {
  $("ket").value = "";
  COLS.forEach((col) => { inputs[col].value = ""; inputs[col].classList.remove("invalid"); });
  Object.keys(wheels).forEach((col) => setWheelPosition(col, 0));
  $("errMsg").textContent = "";
  updatePreview();
}

function cancelEditing() {
  currentEditId = null;
  $("formCard").classList.remove("editing");
  $("formMode").hidden = true;
  updateSaveButton();
}

function editEntry(entry) {
  currentEditId = entry.id;
  $("formCard").classList.add("editing");
  $("formMode").hidden = false;
  $("formModeText").textContent = "Edit data: " + (entry.keterangan || "(tanpa keterangan)");
  $("ket").value = entry.keterangan || "";
  inputs.d.value = String(entry.derajat);
  inputs.m.value = String(entry.menit);
  inputs.s.value = String(entry.detik);
  inputs.jarak.value = String(entry.jarak);
  Object.keys(wheels).forEach((col) => setWheelPosition(col, entry[col]));
  validate();
  $("formCard").scrollIntoView({ behavior: "smooth", block: "start" });
}

function deleteEntry(entry) {
  const pending = getQueue().some((queued) => queued.id === entry.id);
  const promptText = pending
    ? "Hapus data ini dari riwayat dan antrean pengiriman?"
    : "Hapus dari riwayat perangkat? Data yang sudah terkirim tetap ada di spreadsheet.";
  if (!confirm(promptText)) return;
  saveHistory(loadJSON(HIST_KEY, []).filter((item) => item.id !== entry.id));
  saveQueue(getQueue().filter((item) => item.id !== entry.id));
  if (currentEditId === entry.id) {
    cancelEditing();
    resetForm();
  }
  renderHistory();
  updateNetBadge();
  toast(pending ? "Data dihapus dari antrean" : "Riwayat dihapus dari perangkat");
}

/* ================= RIWAYAT ================= */
function renderHistory() {
  const hist = loadJSON(HIST_KEY, []);
  const ul = $("historyList");
  ul.innerHTML = "";
  $("historyEmpty").style.display = hist.length ? "none" : "block";
  hist.forEach((h) => {
    const li = document.createElement("li");
    const info = document.createElement("div");
    info.className = "info";
    const az = h.derajat + h.menit / 60 + h.detik / 3600;
    info.innerHTML =
      "<div class=\"ket\"></div>" +
      "<div class=\"sub\">" + az.toFixed(3) + "° · " + h.jarak + " m · " +
      new Date(h.waktu).toLocaleString("id-ID") + "</div>";
    info.querySelector(".ket").textContent = h.keterangan || "(tanpa keterangan)";
    const pending = getQueue().some((entry) => entry.id === h.id);
    const status = document.createElement("span");
    status.className = "status " + (pending ? "pending" : h.localEdit ? "local" : "sent");
    status.textContent = pending ? "Pending" : h.localEdit ? "Edit lokal" : "Terkirim";
    info.appendChild(status);
    const actions = document.createElement("div");
    actions.className = "actions";
    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.className = "edit-action";
    editButton.textContent = "Edit";
    editButton.addEventListener("click", () => editEntry(h));
    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-action";
    deleteButton.textContent = "Hapus";
    deleteButton.addEventListener("click", () => deleteEntry(h));
    actions.append(editButton, deleteButton);
    li.appendChild(info);
    li.appendChild(actions);
    ul.appendChild(li);
  });
}

/* ================= TOAST ================= */
let toastTimer = null;
function toast(text, isError) {
  const t = $("toast");
  t.textContent = text;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ================= EVENT ================= */
window.addEventListener("online", () => { updateNetBadge(); processQueue(); });
window.addEventListener("offline", updateNetBadge);
window.addEventListener("load", () => { updateNetBadge(); processQueue(); });

/* ================= SERVICE WORKER & WAKE LOCK ================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* abaikan */ });
  });
}

let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) { /* opsional — lanjut tanpa galat */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});
requestWakeLock();

/* ================= INIT ================= */
renderChips();
renderWheels();
renderHistory();
validate();
updateNetBadge();
$("saveButton").addEventListener("click", saveEntry);
$("cancelEdit").addEventListener("click", () => { cancelEditing(); resetForm(); validate(); });
</script>
</body>
